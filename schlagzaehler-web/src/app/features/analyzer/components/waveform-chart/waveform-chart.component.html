<div class="flex flex-col gap-3">
  <!-- Chart Controls & Legend -->
  <div class="flex flex-wrap items-center justify-between gap-3 text-xs min-h-8">
    <div class="flex flex-wrap items-center gap-4">
      <span class="inline-flex items-center gap-1.5 text-slate-300">
        <span class="h-3 w-0.5 bg-rose-400"></span>
        <span>Trigger (t = 0 ms)</span>
      </span>
    </div>

    @if (hoverPoint(); as pt) {
      <div
        class="rounded-lg border border-slate-700 bg-slate-900/90 px-2.5 py-1 font-mono text-xs text-slate-200"
      >
        @if (isAllSensors()) {
          <span
            class="font-semibold"
            [class.text-sky-300]="pt.sensorId === 0"
            [class.text-emerald-300]="pt.sensorId === 1"
            [class.text-amber-300]="pt.sensorId === 2"
          >
            Sensor {{ pt.sensorId }}:
          </span>
        }
        Sample: <span class="text-indigo-300">{{ pt.sampleRel }}</span> ({{
          pt.timeMs >= 0 ? '+' : ''
        }}{{ pt.timeMs.toFixed(1) }} ms) | ADC:
        <span class="font-semibold text-white">{{ pt.adcValue }}</span>
      </div>
    }
  </div>

  <!-- Canvas Wrapper -->
  <div class="relative w-full overflow-hidden rounded-xl border border-slate-800 bg-slate-950">
    <canvas
      #chartCanvas
      class="block h-80 w-full cursor-crosshair sm:h-96"
      aria-label="Piezo sensor waveform chart"
      (mousemove)="onMouseMove($event)"
      (mouseleave)="onMouseLeave()"
    ></canvas>
  </div>
</div>
