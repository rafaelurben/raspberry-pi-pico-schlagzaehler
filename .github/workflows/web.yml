name: Deploy Angular app to GitHub Pages

on:
  push:
    paths:
      - "schlagzaehler-web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: schlagzaehler-web

jobs:
  # Test job
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: schlagzaehler-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Angular application
        run: npm run test

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: schlagzaehler-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Copy index.html to 404.html for SPA routing
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        run: cp dist/schlagzaehler-web/browser/index.html dist/schlagzaehler-web/browser/404.html

      - name: Upload artifact
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: schlagzaehler-web/dist/schlagzaehler-web/browser

  # Deployment job
  deploy:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
