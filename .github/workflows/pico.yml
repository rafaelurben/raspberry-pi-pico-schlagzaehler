name: schlagzaehler-pico

on:
  push:
    paths:
      - "schlagzaehler-pico/**"
      - ".github/workflows/pico.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup C++
        uses: aminya/setup-cpp@15a6bd8cf39030f88b5da3d203a829ec4eea4955 # v1.10.1
        with:
          compiler: llvm

      - name: Compile C tests
        working-directory: schlagzaehler-pico
        run: |
          ${CC:-cc} -std=c23 -Wall -Wextra -Isrc \
            tests/test_firmware.c \
            src/App/ConfigService.c \
            src/App/HitDetection/HitDetector.c \
            src/App/HitDetection/SignalCapture.c \
            src/App/Game/GameState.c \
            src/App/Game/Modes/CountMode.c \
            src/App/Game/Modes/TimedMode.c \
            src/App/Game/Modes/RaceMode.c \
            src/App/Game/GameController.c \
            src/App/Input/ButtonController.c \
            src/App/Companion/CommandHandler.c \
            src/App/Companion/CompanionProtocol.c \
            src/App/Display/DisplayPresenter.c \
            -lm -o /tmp/test_firmware

      - name: Execute C tests
        run: /tmp/test_firmware

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build schlagzaehler-pico
        id: build
        uses: samyarsadat/Pico-Build-Action@dbb9ed078bfed217ef917dd09860c2c5096e8eb9 # v1.3.0
        with:
          source_dir: "schlagzaehler-pico"
          cmake_args: "-DCMAKE_BUILD_TYPE=Debug"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace_artifacts
          path: ${{steps.build.outputs.output_dir}}
