name: Deploy Angular app to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "schlagzaehler-web/**"
      - ".github/workflows/deploy-pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: schlagzaehler-web

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: schlagzaehler-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/schlagzaehler-web/browser/index.html dist/schlagzaehler-web/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: schlagzaehler-web/dist/schlagzaehler-web/browser

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
